// Kotlin 2.4 metadata requires R8 9.1.29 or later; override the version embedded in AGP.
pluginManagement {
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools:r8:9.1.57'
        }
    }
}

include ':TMessagesProj'
include ':TMessagesProj_App'
include ':jlatexmath'
project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
apply from: file("TMessagesProj_Modules/media/core_settings.gradle")
